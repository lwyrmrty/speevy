<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verification</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
    </style>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async></script>
  </head>
  <body>
    <div id="widget"></div>
    <script>
      (function () {
        var sitekey = new URLSearchParams(location.search).get('sitekey') || '';
        var rendered = false;
        var lastType = '';
        var lastToken = '';
        var ack = false;
        window.__speevyTurnstileToken = '';

        function writeParent(token) {
          try {
            var inputs = window.parent.document.getElementsByName('cf-turnstile-response');
            for (var i = 0; i < inputs.length; i += 1) {
              inputs[i].value = token || '';
            }
          } catch (error) {
            // Parent document may not be reachable yet.
          }
        }

        function post() {
          if (!window.parent || window.parent === window) return;
          try {
            window.parent.postMessage(
              { source: 'speevy-turnstile', type: lastType, token: lastToken },
              '*',
            );
          } catch (error) {
            // Retry on the interval below.
          }
          writeParent(lastToken);
        }

        function notify(type, token) {
          lastType = type;
          lastToken = token || '';
          window.__speevyTurnstileToken = lastToken;
          ack = false;
          post();
        }

        window.addEventListener('message', function (event) {
          if (event.origin !== location.origin) return;
          if (!event.data || event.data.source !== 'speevy-turnstile') return;
          if (event.data.type === 'ack') ack = true;
        });

        setInterval(function () {
          if (lastType && !ack) post();
        }, 250);

        function renderWidget() {
          if (rendered || !sitekey || !window.turnstile) return;
          rendered = true;
          try {
            window.turnstile.render(document.getElementById('widget'), {
              sitekey: sitekey,
              size: 'flexible',
              callback: function (token) {
                notify('token', token);
              },
              'expired-callback': function () {
                notify('token', '');
              },
              'error-callback': function () {
                notify('error', '');
              },
            });
          } catch (error) {
            notify('error', '');
          }
        }

        if (window.turnstile) {
          renderWidget();
          return;
        }

        var started = Date.now();
        var timer = setInterval(function () {
          if (window.turnstile) {
            clearInterval(timer);
            renderWidget();
            return;
          }
          if (Date.now() - started > 8000) {
            clearInterval(timer);
            notify('error', '');
          }
        }, 50);
      })();
    </script>
  </body>
</html>
